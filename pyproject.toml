[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parallax-ctf"
version = "0.3.0"
description = "Parallax Ganymede: an artifact-scoped multi-agent runtime for CTF and security analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "ruff>=0.8,<1"]

[project.scripts]
parallax = "parallax.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"parallax.web" = ["static/*.html", "static/*.css", "static/*.js"]
"parallax.plugins" = ["builtin/*/*.toml", "builtin/*/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
